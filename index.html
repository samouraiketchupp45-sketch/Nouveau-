<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXOTICZ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%, #ff2bd6 0%, transparent 25%),
    radial-gradient(circle at 85% 25%, #00d4ff 0%, transparent 25%),
    linear-gradient(135deg,#090014,#220046,#ff2f92,#ff9f43);
}

.overlay{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
  background:rgba(0,0,0,.28);
}

.logo{
  font-size:86px;
  font-weight:900;
  letter-spacing:10px;
  text-shadow:
    0 0 18px #ff00d4,
    0 0 40px #00d4ff,
    0 0 90px #ff00d4;
}

.subtitle{
  margin-top:18px;
  font-size:22px;
  font-weight:900;
  letter-spacing:12px;
  text-shadow:0 0 20px #00d4ff;
}

.card{
  margin-top:38px;
  width:100%;
  max-width:390px;
  padding:26px;
  border-radius:28px;
  background:rgba(255,255,255,.13);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.card h2{
  margin:0 0 12px;
  letter-spacing:2px;
}

.card p{
  margin:0;
  line-height:1.6;
  opacity:.92;
}

button{
  margin-top:26px;
  padding:16px 52px;
  border:none;
  border-radius:50px;
  font-size:18px;
  font-weight:900;
  color:white;
  background:linear-gradient(90deg,#ff00cc,#00d4ff);
  box-shadow:0 0 28px rgba(255,0,204,.7);
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

.palms{
  position:absolute;
  bottom:20px;
  font-size:58px;
  opacity:.35;
}
</style>
</head>

<body>
  <div class="overlay">

    <div class="logo">EXOTICZ</div>

    <div class="subtitle">PREMIUM CLUB</div>

    <div class="card">
      <h2>WELCOME</h2>

      <p>
        Catalogue premium,<br>
        programme fidélité,<br>
        cadeaux exclusifs.
      </p>

      <button>ENTRER</button>
    </div>

    <div class="palms">🌴 🌴 🌴</div>

  </div>
</body>
</html>
